# XcodeGen spec. The .xcodeproj is generated, never committed, so agents and
# humans never fight over merge conflicts in project.pbxproj.
#   brew install xcodegen && cd App && xcodegen generate && open SupportSense.xcodeproj
name: SupportSense
options:
  bundleIdPrefix: com.paulmadojutimi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SupportSenseCore:
    path: ..
targets:
  SupportSense:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: SupportSenseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulmadojutimi.supportsense
        PRODUCT_NAME: SupportSense
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SupportSense
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  SupportSense:
    build:
      targets:
        SupportSense: all
